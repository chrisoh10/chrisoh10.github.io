<style>
  :root{
    --ground-top:#EDF0E8;
    --ground-bot:#D6DDD0;
    --panel:#FBFBF7;
    --ink:#1F2C20;
    --ink-soft:rgba(31,44,32,.60);
    --ink-faint:rgba(31,44,32,.38);
    --line:rgba(31,44,32,.14);
    --brass:#8E8047;
    --r:20px;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  html{-webkit-text-size-adjust:100%}

  body{
    min-height:100svh;
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 70% at 50% -10%, #F4F6F0 0%, rgba(244,246,240,0) 60%),
      linear-gradient(178deg, var(--ground-top) 0%, var(--ground-bot) 100%);
    background-attachment:fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:
      calc(24px + env(safe-area-inset-top)) 18px
      calc(24px + env(safe-area-inset-bottom));
  }

  .panel{
    width:100%;
    max-width:400px;
    position:relative;
    z-index:1;
    background:
      radial-gradient(115% 55% at 50% 0%, rgba(255,255,255,.9) 0%, rgba(255,255,255,0) 62%),
      linear-gradient(180deg, rgba(251,251,247,.90) 0%, rgba(248,249,243,.82) 100%);
    -webkit-backdrop-filter:blur(20px) saturate(115%);
    backdrop-filter:blur(20px) saturate(115%);
    border:1px solid rgba(255,255,255,.55);
    border-radius:28px;
    box-shadow:0 28px 70px -30px rgba(24,38,26,.34);
    padding:52px 26px 26px;
  }

  /* 종이 결 — 인쇄물 같은 촉감을 준다 */
  .panel::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:2;
    border-radius:inherit;
    pointer-events:none;
    opacity:.42;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'>\
<filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='180' height='180' filter='url(%23g)' opacity='.30'/></svg>");
    background-size:180px 180px;
  }

  /* ── 배경: 빛 무리 + 흔들리는 갈대 ── */
  .scene{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }

  .haze{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    will-change:transform;
  }
  .h1{
    width:70vmax; height:70vmax;
    top:-32vmax; left:-22vmax;
    background:radial-gradient(circle, rgba(255,255,255,.62) 0%, rgba(255,255,255,0) 70%);
    animation:drift1 34s ease-in-out infinite alternate;
  }
  .h2{
    width:56vmax; height:56vmax;
    bottom:-24vmax; right:-18vmax;
    background:radial-gradient(circle, rgba(154,176,140,.55) 0%, rgba(154,176,140,0) 70%);
    animation:drift2 44s ease-in-out infinite alternate;
  }
  @keyframes drift1{to{transform:translate3d(7vmax,5vmax,0) scale(1.12)}}
  @keyframes drift2{to{transform:translate3d(-6vmax,-4vmax,0) scale(1.08)}}

  .grass{
    position:absolute;
    left:0; bottom:0;
    width:100%;
    height:auto;
    max-height:56vh;
  }
  .grass g.far  path,.grass g.far  ellipse{fill:rgba(43,64,45,.13)}
  .grass g.mid  path,.grass g.mid  ellipse{fill:rgba(37,56,39,.19)}
  .grass g.near path,.grass g.near ellipse{fill:rgba(28,44,30,.26)}

  .blade{
    transform-box:fill-box;
    transform-origin:50% 100%;
    animation-name:sway;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    animation-direction:alternate;
    will-change:transform;
  }
  @keyframes sway{
    from{transform:rotate(calc(var(--a) * -1))}
    to  {transform:rotate(var(--a))}
  }

  @media (prefers-reduced-motion:reduce){
    .haze,.blade{animation:none}
  }

  /* ── 헤더 ── */
  .mark{
    display:block;
    width:min(78%,270px);
    height:auto;
    margin:0 auto;
  }

  .slogan{
    font-family:"Gowun Batang",serif;
    font-size:15px;
    line-height:1.85;
    letter-spacing:.01em;
    color:var(--ink-soft);
    text-align:center;
    margin-top:22px;
  }

  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    margin:26px 0 32px;
  }
  .divider i{
    display:block;
    width:38px;
    height:1px;
    background:linear-gradient(90deg, rgba(142,128,71,0), rgba(142,128,71,.6));
  }
  .divider i:last-child{
    background:linear-gradient(90deg, rgba(142,128,71,.6), rgba(142,128,71,0));
  }
  .divider .sprig{
    width:23px;
    height:32px;
    color:var(--ink);
    opacity:.5;
  }

  /* ── 버튼 ── */
  .links{display:flex;flex-direction:column;gap:11px}

  .link{
    position:relative;
    display:flex;
    align-items:center;
    min-height:60px;
    padding:0 20px;
    border-radius:var(--r);
    text-decoration:none;
    color:var(--ink);
    border:1px solid var(--line);
    background:transparent;
    transition:background-color .35s ease, border-color .35s ease, transform .2s ease;
  }

  .link .ico{
    flex:0 0 22px;
    height:22px;
    display:grid;
    place-items:center;
    color:var(--ink-faint);
    transition:color .35s ease;
  }
  .link .ico svg{width:20px;height:20px;display:block}

  .link .label{
    flex:1;
    text-align:center;
    font-size:16.5px;
    font-weight:600;
    letter-spacing:-.01em;
    margin-left:-22px; /* 아이콘 폭 보정 → 라벨을 카드 정중앙에 */
    padding:0 22px;
  }

  /* 대표 행동: 쇼핑몰만 채워서 위계를 만든다 */
  .link.primary{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--panel);
  }
  .link.primary .ico{color:rgba(251,251,247,.72)}

  @media (hover:hover){
    .link:hover{background:rgba(31,44,32,.045);border-color:rgba(31,44,32,.28)}
    .link:hover .ico{color:var(--ink)}
    .link.primary:hover{background:#16211A;border-color:#16211A}
    .link.primary:hover .ico{color:var(--panel)}
  }
  .link:active{transform:scale(.985)}

  .link:focus-visible{
    outline:2px solid var(--brass);
    outline-offset:3px;
  }

  /* ── 푸터 ── */
  footer{
    margin-top:30px;
    padding-top:20px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  footer p{
    font-size:11.5px;
    line-height:1.7;
    color:var(--ink-faint);
    letter-spacing:.01em;
  }

  /* ── 진입 모션: 한 번만, 천천히 ── */
  @media (prefers-reduced-motion:no-preference){
    .fade{opacity:0;transform:translateY(10px);animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards}
    .mark{animation-delay:.05s}
    .slogan{animation-delay:.30s}
    .divider{animation-delay:.45s}
    .links .link:nth-child(1){animation-delay:.55s}
    .links .link:nth-child(2){animation-delay:.65s}
    .links .link:nth-child(3){animation-delay:.75s}
    .links .link:nth-child(4){animation-delay:.85s}
    footer{animation-delay:.95s}
  }
  @keyframes rise{to{opacity:1;transform:none}}

  @media (max-width:359px){
    .panel{padding:42px 20px 22px}
    .link .label{font-size:15.5px}
  }
</style>
</head>
